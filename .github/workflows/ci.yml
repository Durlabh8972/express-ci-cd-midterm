name: CI Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/express-ci-cd:${{ github.sha }} .

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/express-ci-cd:${{ github.sha }}

      - name: Tag as dev or latest
        if: github.ref == 'refs/heads/develop'
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/express-ci-cd:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/express-ci-cd:dev
          docker push ${{ secrets.DOCKER_USERNAME }}/express-ci-cd:dev

      - name: Tag as prod
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/express-ci-cd:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/express-ci-cd:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/express-ci-cd:latest
